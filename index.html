<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Ulang Tahun</title>
    <!-- Mengambil font Serif klasik (Playfair Display & Lora) dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;1,400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* Reset dasar */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #F9F8F6; /* Warna kertas hangat minimalis */
            color: #222222;            /* Hitam arang yang lembut di mata */
            font-family: 'Lora', Georgia, serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            line-height: 1.8;
        }

        .card {
            background-color: #FFFFFF;
            max-width: 540px;
            width: 100%;
            padding: 60px 45px;
            border: 1px solid #E5E2DC;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.03);
            text-align: center;
            animation: fadeIn 1.4s ease-out;
        }

        .date {
            font-size: 0.75rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: #8C857B;
            margin-bottom: 24px;
        }

        h1 {
            font-family: 'Playfair Display', Georgia, serif;
            font-weight: 400;
            font-size: 2.6rem;
            line-height: 1.25;
            letter-spacing: -0.01em;
            margin-bottom: 12px;
            color: #1A1A1A;
        }

        .name {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            font-size: 1.5rem;
            color: #5C554B;
            margin-bottom: 32px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background-color: #D1CCC2;
            margin: 0 auto 32px auto;
        }

        .message {
            font-size: 1.02rem;
            color: #4A4A4A;
            margin-bottom: 40px;
            font-weight: 400;
        }

        .signature {
            font-family: 'Playfair Display', Georgia, serif;
            font-style: italic;
            font-size: 1.05rem;
            color: #7A7369;
        }

        /* Animasi muncul perlahan */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Responsif untuk layar HP */
        @media (max-width: 480px) {
            .card {
                padding: 45px 28px;
            }
            h1 {
                font-size: 2.1rem;
            }
            .name {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <main class="card">
        <p class="date">21 November 2026</p>
        
        <h1>Selamat<br>Ulang Tahun</h1>
        <p class="name">Untuk Seseorang yang Istimewa</p>
        
        <div class="divider"></div>
        
        <p class="message">
            Semoga di usia yang baru ini, setiap langkahmu selalu dipenuhi dengan ketenangan, kesehatan, dan kebahagiaan yang sederhana namun bermakna. Teruslah bertumbuh dan menjadi cahaya bagi sekitarmu.
        </p>
        
        <p class="signature">— Dengan penuh doa &amp; harapan</p>
    </main>

</body>
</html>
